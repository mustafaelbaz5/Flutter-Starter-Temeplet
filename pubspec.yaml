name: flutter_structure
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

# ENVIRONMENT
environment:
  sdk: ^3.9.2


# DEPENDENCIES
dependencies:
  flutter:
    sdk: flutter

  # --- Firebase ---
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_storage: ^13.1.0

  # --- Supabase ---
  supabase_flutter: ^2.12.0

  # --- State Management ---
  bloc: ^9.2.0
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1

  # --- Networking ---
  dio: ^5.9.2

  # --- Storage & Preferences ---
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  path_provider: ^2.1.5

  # --- Dependency Injection ---
  get_it: ^9.2.1

  # --- Localization ---
  easy_localization: ^3.0.8

  # --- UI & Design ---
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.7

  # --- Utilities ---
  rename: ^3.1.0
  internet_connection_checker: ^3.0.1
  equatable: ^2.0.8

# ----------------------------------------------------------------
# DEV DEPENDENCIES
# ----------------------------------------------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
  mockito: ^5.4.0
  build_runner: ^2.4.0


# ----------------------------------------------------------------
# FLUTTER SETTINGS
# ----------------------------------------------------------------
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - assets/lang/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/manrope/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800

    - family: Tajawal
      fonts:
        - asset: assets/fonts/tajawal/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/tajawal/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/tajawal/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/tajawal/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/tajawal/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/tajawal/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/tajawal/Tajawal-Black.ttf
          weight: 900